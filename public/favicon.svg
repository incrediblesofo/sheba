<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 1254 1254" fill="none">
  <!-- Reuse the full shebalogo but with a dark background for favicon visibility -->
  <rect width="1254" height="1254" rx="200" fill="#1A110A"/>
  
  <!-- Thin gold border -->
  <rect x="20" y="20" width="1214" height="1214" rx="180" fill="none" stroke="#C99A35" stroke-width="8" opacity="0.4"/>
  
  <!-- The horn graphic area — cropped to just horn + eq bars (roughly y:260-740, centered) -->
  <!-- We'll scale the horn content to fill the favicon area -->
  
  <!-- Equaliser bars (gold) -->
  <g opacity="0.85">
    <rect x="490" y="280" width="30" height="130" rx="15" fill="#C99A35" opacity="0.6"/>
    <rect x="535" y="310" width="30" height="100" rx="15" fill="#C99A35" opacity="0.5"/>
    <rect x="580" y="260" width="30" height="170" rx="15" fill="#C99A35" opacity="0.8"/>
    <rect x="625" y="240" width="32" height="200" rx="16" fill="#D4A843"/>
    <rect x="672" y="270" width="30" height="155" rx="15" fill="#C99A35" opacity="0.75"/>
    <rect x="717" y="300" width="30" height="120" rx="15" fill="#C99A35" opacity="0.55"/>
    <rect x="762" y="330" width="30" height="90"  rx="15" fill="#C99A35" opacity="0.45"/>
  </g>
  
  <!-- Horn body — simplified curved horn shape -->
  <path d="
    M 200 580
    Q 250 530, 340 510
    Q 450 485, 550 490
    Q 680 500, 780 540
    Q 870 575, 940 640
    Q 990 690, 1010 740
    Q 1030 790, 1010 830
    Q 990 860, 950 870
    Q 910 875, 870 840
    Q 810 790, 730 750
    Q 640 710, 550 690
    Q 450 670, 360 680
    Q 290 690, 250 670
    Q 210 650, 200 620
    Q 195 600, 200 580
    Z
  " fill="#6B4226"/>
  
  <!-- Horn body highlight -->
  <path d="
    M 230 575
    Q 280 535, 360 515
    Q 460 495, 560 498
    Q 680 508, 780 545
    Q 860 575, 920 630
    Q 960 665, 975 710
    Q 960 700, 930 680
    Q 860 640, 770 610
    Q 670 580, 560 570
    Q 460 560, 370 575
    Q 310 585, 270 575
    Q 240 570, 230 575
    Z
  " fill="#8B5E3C" opacity="0.7"/>
  
  <!-- Horn darker underside -->
  <path d="
    M 250 620
    Q 300 650, 380 665
    Q 470 680, 570 680
    Q 670 675, 760 700
    Q 830 720, 890 760
    Q 930 790, 950 830
    Q 960 850, 940 860
    Q 920 865, 890 840
    Q 830 795, 750 760
    Q 660 725, 560 705
    Q 460 690, 370 695
    Q 300 700, 260 680
    Q 230 660, 250 620
    Z
  " fill="#4A2C17" opacity="0.6"/>
  
  <!-- Bell opening -->
  <ellipse cx="990" cy="780" rx="65" ry="90" transform="rotate(-20 990 780)" fill="#5C371F" stroke="#8B5E3C" stroke-width="4"/>
  <ellipse cx="990" cy="780" rx="42" ry="60" transform="rotate(-20 990 780)" fill="#3A1F0B" opacity="0.7"/>
  
  <!-- Mouthpiece -->
  <ellipse cx="200" cy="595" rx="25" ry="30" fill="#6B4226"/>
  <ellipse cx="197" cy="595" rx="14" ry="18" fill="#4A2C17" opacity="0.7"/>
  
  <!-- Wrapping bands -->
  <rect x="340" y="490" width="55" height="190" rx="8" fill="#D4A843" opacity="0.75" transform="rotate(-5 365 585)"/>
  <rect x="320" y="498" width="55" height="178" rx="8" fill="#C99A35" opacity="0.35" transform="rotate(-5 345 587)"/>
  <rect x="440" y="480" width="40" height="195" rx="6" fill="#D4A843" opacity="0.55" transform="rotate(-3 460 577)"/>
  
  <!-- Decorative arc under the horn -->
  <path d="M 300 890 Q 620 940, 960 880" stroke="#C99A35" stroke-width="10" fill="none" opacity="0.45" stroke-linecap="round"/>
</svg>